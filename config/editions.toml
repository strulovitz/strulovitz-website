# THE EDITION ROSTER
# ==================
#
# WHAT THIS FILE IS
# The list of AI models that each produce their own edition of the magazine,
# and the few knobs that control how they are asked. Nir chose every model here
# by name. No agent adds, removes or substitutes a model in this file without
# Nir saying so out loud.
#
# WHAT AN EDITION IS (DECISIONS.md decision 12)
# One model does EVERY role for a story: it reads the frozen sources, pulls out
# the facts, writes the headline, the one-line TLDR and the article itself,
# writes the plain-English explanations of the technical terms it leans on,
# chooses the tags, decides what links to what, and writes the prompt for the
# illustration. There is never a division of labour between models. Model A's
# edition is entirely model A's work, and model B's edition is entirely
# model B's, on the identical raw material.
#
# WHY EIGHT GALAXIES AND NOT ONE (DECISIONS.md decision 20)
# Because each model chooses its own tags and its own links, and those choices
# decide where things sit in the four-dimensional world. So each edition has
# its own map. Switching edition rearranges the sky. A model that links
# unrelated things is telling the reader something true about itself, and that
# is the product, not a bug.
#
# WHY NOTHING IS CHECKED OR CORRECTED (DECISIONS.md decision 16)
# If a model writes nonsense, we publish the nonsense as that model's edition.
# The reader notices, switches edition, and sees instantly which model can be
# trusted. That comparison IS the fact-checking, and it is the whole point of
# the site. No agent ever edits a model's output, retries because the answer
# looked poor, or picks the best of several attempts.
#
# HOW TO ADD A MODEL LATER (this is meant to be easy, on purpose)
# Add a [[model]] block below with its OpenRouter id and a short honest note
# about why it is here, then run:
#     python3 pipeline/run.py --fill
# The machine notices the new model has an empty cell for every story that
# already exists, and fills exactly those. Nothing already done is redone.
#
# HOW TO ADD A STORY LATER
# Put the source links in content/inbox.txt and run the same command. The
# machine notices the new story has an empty cell for every model and fills
# exactly those. Same command, both directions.


[grid]
# The model whose edition a visitor sees when they arrive without choosing.
# Nir: "people identify AI with GPT (those who do not know the field)."
# Changing the face of the whole site is this one line. The folder structure is
# perfectly symmetrical, so no model has a privileged position on disk.
default_model = "openai/gpt-5.6-terra"

# Buy everything at half price by not demanding a fast answer. OpenRouter's
# batch service is the identical model and the identical weights, billed at
# 50%, with a 24-hour window. Nir: "please do everything you can in batch. we
# have time." Set this to false only to debug something interactively.
use_batch = true

# Minimum independent sources before a story may be written at all
# (DECISIONS.md decision 13, and bible/part-00.md LAW 7). Nir, on why this is
# not negotiable even for the best story imaginable: "if a story is only from
# one source, even if it is the most amazing story, like new aliens came and
# handed us AGI, i cannot publish it, because i can get sued and lose all my
# money."
minimum_sources = 2

# A ceiling on how much a model may write in one answer. This is a guard
# against a runaway loop printing forever, NOT a budget (DECISIONS.md decision
# 15: there is no daily dollar ceiling; the roster is the limit).
max_output_tokens = 32000

# Language of everything published. Nir: "always English ONLY please."
language = "en"


# ------------------------------------------------------------------------------
# THE ROSTER. One model per company, deliberately: the MIDDLE of the spectrum -
# too big for anyone to run at home, but not the frontier flagships whose price
# would make a magazine impossible. Prices below are dollars per million tokens
# as of the price snapshot of 2026-08-21, before the 50% batch discount, and
# they are a comment for humans: the real cost of every call is measured from
# what OpenRouter actually charges and written into the job ledger.
# ------------------------------------------------------------------------------

