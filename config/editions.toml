# ------------------------------------------------------------------------------
# DELIBERATELY NOT ON THE ROSTER, so that no future agent 'helpfully' adds them.
# ------------------------------------------------------------------------------
# FREE MODELS. Nir: "i do not want things that are free and later disappear."
# ANYTHING RUNNABLE AT HOME - Mistral Small and its kind. If a local-model
#   edition ever happens, it is its own clearly-labelled thing, not mixed in
#   with models nobody can run in a house.
# REJECTED BY NAME: inclusionai/ling-2.6-1t, tencent/hy3, meituan/longcat-2.0,
#   the bytedance seed models, nvidia/nemotron ("not strong at all"),
#   anthropic/claude-haiku-4.5 ("who use this? nobody").
# THE FRONTIER FLAGSHIPS: Kimi K3, GPT-5.6 Sol, Opus-class models. A whole
#   magazine cannot be run through them at a price Nir will accept.
