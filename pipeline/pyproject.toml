[project]
# The AI PANORAMA pipeline. Runs on ATLAS (the desktop) only.
# See bible/part-01.md section 1.5 for what belongs here.
name = "ai-panorama-pipeline"
version = "0.1.0"
description = "AI PANORAMA content pipeline: ingest, claims, synthesis, scoring, layout, export."
requires-python = ">=3.12"

# Dependencies are added deliberately, one at a time, with a reason.
# Versions are pinned by the uv lockfile (uv.lock), never floating.
dependencies = [
    # httpx: every outbound API call goes through httpx (bible/part-01.md 1.5.3).
    # First use: the weekly OpenRouter price/spec snapshot (bible/part-09.md 9.4).
    "httpx>=0.28,<0.29",
    # neo4j: the official database driver. Used ONLY through pipeline/lib/db.py,
    # never imported directly by a stage (bible/part-01.md 1.4, access
    # discipline). One door to the database, so schema changes happen in one
    # place.
    "neo4j>=6.2,<7",
    # trafilatura: pulls the actual article out of a news page and throws away
    # the navigation, adverts and cookie banners (bible/part-06.md 6.2.1).
    # First use: freezing the sources a story is built from.
    "trafilatura>=2.0,<3",
    # yt-dlp: fetches a YouTube video's SUBTITLES and its title, channel and
    # date, so three different YouTubers talking about the same event can be
    # sources for one story. We take the captions rather than transcribing the
    # audio ourselves: it is instant, free, and needs no graphics card.
    "yt-dlp>=2025.1.1",
    # networkx: the force layout that decides where each edition's nodes sit in
    # its own galaxy (bible/part-03.md 3.2). Every edition gets its own layout.
    "networkx>=3.4,<4",
    # numpy: the arithmetic underneath the layout and the quantised positions
    # the browser reads.
    "numpy>=2.1,<3",
    "pillow>=12.3.0",
]

[tool.uv]
# The virtual environment lives inside this folder, on /home (the 1.7 TB disk).
package = false
